[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marketcanvas-env"
version = "0.1.0"
description = "Deterministic design-canvas environment with MCP and evaluator experiments"
requires-python = ">=3.12"
dependencies = ["pillow==12.3.0", "numpy==2.5.3", "pydantic==2.13.5", "mcp==1.30.0", "gymnasium==1.3.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["marketcanvas*"]

[tool.setuptools.package-data]
marketcanvas = ["assets/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
